<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Simples</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link para o CSS -->
    <script src="script.js" defer></script> <!-- Link para o JS -->
</head>
<body>
    <form id="meuFormulario" action="insercao.php" method="POST"> <!-- Formulário que envia dados via POST -->
        <label for="nome">Nome:</label> <!-- Rótulo para o campo Nome -->
        <input type="text" id="nome" name="nome" required> <!-- Campo de texto para Nome -->
        
        <label for="email">Email:</label> <!-- Rótulo para o campo Email -->
        <input type="email" id="email" name="email" required> <!-- Campo de texto para Email -->
        
        <label for="telefone">Telefone:</label> <!-- Rótulo para o campo Telefone -->
        <input type="tel" id="telefone" name="telefone" required> <!-- Campo de texto para Telefone -->
        
        <label for="mensagem">Mensagem:</label> <!-- Rótulo para o campo Mensagem -->
        <textarea id="mensagem" name="mensagem" required></textarea> <!-- Campo de texto para Mensagem -->
        
        <button type="submit">Enviar</button> <!-- Botão para enviar o formulário -->
    </form>
</body>
</html>
