<!DOCTYPE html>
<html>
<head>
    <title>Cadastro de Produto</title>
</head>
<body>
    <form method="post" action="cadastro_produto.php">
        <label>Nome:</label><input type="text" name="nome" required>
        <label>Categoria:</label><input type="text" name="categoria" required>
        <label>Quantidade:</label><input type="number" name="quantidade" required>
        <label>Validade:</label><input type="date" name="validade">
        <label>Unidade:</label><input type="text" name="unidade" required>
        <label>Estoque Mínimo:</label><input type="number" name="estoque_minimo" required>
        <button type="submit">Cadastrar Produto</button>
    </form>
</body>
</html>
